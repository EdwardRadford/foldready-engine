name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # No `npx playwright install webkit`: the URL guard tests are pure string
      # and IP work, so nothing here needs a browser or the network.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Types (tests)
        run: npm run typecheck:test

      - name: Tests
        run: npm test
